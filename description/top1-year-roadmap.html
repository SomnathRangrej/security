<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body data-new-gr-c-s-check-loaded="14.1338.0" data-gr-ext-installed=""><svg id="top1-year-roadmap" width="100%" viewBox="0 0 900 1680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>How to reach the top 1% in 12 months</title>
  <desc>Infographic of a 12-month plan: results lag habits by months, stop harmful habits first, then practice four pillars—body, mind, owned assets, and quiet focus—until discipline becomes identity and results catch up.</desc>
  <defs>
    <pattern id="dot-texture" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="light-dark(#c4b5a0, #3a342c)"></circle>
    </pattern>

      <line x1="0" y1="0" x2="0" y2="8" stroke="light-dark(#d6cbb8, #2f2a24)" stroke-width="1.5"></line>

  </defs>
  <style>

    #top1-year-roadmap .b { font: 600 15px ui-sans-serif, system-ui, sans-serif; }

  <rect class="bg" width="900" height="1680"></rect>
  <rect x="0" y="0" width="900" height="1680" fill="url(#dot-texture)" opacity="0.55"></rect>

  <ellipse cx="820" cy="1600" rx="110" ry="80" fill="light-dark(#d9e8e4, #1e2a28)" opacity="0.7"></ellipse>

  <text class="title ink" x="450" y="78" text-anchor="middle">Top 1% in 12 months</text>
  <text class="s mute" x="450" y="108" text-anchor="middle">Not by grinding harder. By becoming a different person—then waiting for life to catch up.</text>

  <rect class="panel" x="48" y="136" width="804" height="168" rx="18"></rect>
  <rect class="panel-edge" x="48" y="136" width="804" height="168" rx="18"></rect>
  <circle cx="118" cy="220" r="42" fill="light-dark(#dcecf5, #243442)"></circle>
  <rect x="96" y="198" width="44" height="44" rx="6" fill="light-dark(#9ec9e6, #3d6f8f)"></rect>
  <path d="M104 214 h28 M104 226 h28 M104 238 h18" stroke="light-dark(#1f3a5f, #cfe6f5)" stroke-width="3" stroke-linecap="round"></path>
  <text class="h ink" x="188" y="188">1 · Results are late</text>
  <text class="s mute" x="188" y="214">Today’s life is leftovers from habits 6–12 months ago.</text>
  <text class="s mute" x="188" y="236">Heating ice: 10° → 31° looks like failure. At 32°, it melts.</text>
  <text class="b accent" x="188" y="268">Work in the dark. You’re storing potential, not failing.</text>

  <rect class="panel" x="48" y="324" width="388" height="150" rx="16"></rect>
  <rect class="panel-edge" x="48" y="324" width="388" height="150" rx="16"></rect>
  <text class="h ink" x="72" y="358">2 · Copy the person</text>
  <text class="s mute" x="72" y="386">Want the lifestyle of the 1%</text>
  <text class="s mute" x="72" y="408">while keeping 99% habits?</text>
  <text class="b teal" x="72" y="440">Change identity first. Outcomes follow.</text>

  <rect class="panel" x="464" y="324" width="388" height="150" rx="16"></rect>
  <rect class="panel-edge" x="464" y="324" width="388" height="150" rx="16"></rect>
  <text class="h ink" x="488" y="358">4 · Invert the problem</text>
  <text class="s mute" x="488" y="386">Ask: what life do I refuse?</text>
  <text class="s mute" x="488" y="408">Study broke, stuck, unhappy—then avoid it.</text>
  <text class="b navy" x="488" y="440">“Avoid being unsuccessful.”</text>

  <rect x="48" y="498" width="804" height="236" rx="18" fill="light-dark(#fff4ea, #2a2018)"></rect>
  <rect x="48" y="498" width="804" height="236" rx="18" fill="none" stroke="light-dark(#e8c4a0, #5a4030)" stroke-width="2"></rect>
  <text class="tiny accent" x="72" y="528">MONTHS 1–3</text>
  <text class="h ink" x="72" y="556">3 · Stop the bleed</text>
  <text class="s mute" x="72" y="582">You can’t build a house on a swamp. Cut what pulls you down before you “level up.”</text>

  <g transform="translate(72,608)">
    <rect width="170" height="88" rx="12" fill="light-dark(#ffffff, #1f1a14)" stroke="light-dark(#e4d7c4, #3d3428)"></rect>
    <text class="b ink" x="16" y="30">Cut these</text>
    <text class="tiny mute" x="16" y="52">Complaining · News binge</text>
    <text class="tiny mute" x="16" y="70">Mindless scroll · Quitters</text>
  </g>
  <g transform="translate(262,608)">
    <rect width="170" height="88" rx="12" fill="light-dark(#ffffff, #1f1a14)" stroke="light-dark(#e4d7c4, #3d3428)"></rect>
    <text class="b ink" x="16" y="30">Also cut</text>
    <text class="tiny mute" x="16" y="52">Lazy defaults · Goal talk</text>
    <text class="tiny mute" x="16" y="70">Loser circles · React-mode</text>
  </g>
  <g transform="translate(452,608)">
    <rect width="372" height="88" rx="12" fill="light-dark(#1f3a5f, #7aa2d4)"></rect>
    <text class="b" x="20" y="36" fill="light-dark(#fffaf2, #1a1814)">90-day rule</text>
    <text class="s" x="20" y="62" fill="light-dark(#dce8f5, #1f2a38)">Ignore the scoreboard. Just stop average habits. You’re already ahead.</text>
  </g>

  <text class="tiny teal" x="72" y="770">MONTHS 4–9 · THE CORE FOUR</text>
  <text class="h ink" x="72" y="798">5 · Four non-negotiables (feelings optional)</text>
  <text class="s mute" x="72" y="822">Complexity is procrastination. Do these whether you feel like it or not.</text>

  <g transform="translate(48,846)">
    <rect width="192" height="220" rx="16" fill="light-dark(#eaf5e8, #1e2a1c)"></rect>
    <rect width="192" height="220" rx="16" fill="none" stroke="light-dark(#b7d6b0, #3a5536)" stroke-width="2"></rect>
    <circle cx="96" cy="48" r="28" fill="light-dark(#3f6b3a, #8fbf7a)"></circle>
    <path d="M84 48 l8 10 16-22" fill="none" stroke="light-dark(#fffaf2, #1a1814)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    <text class="b ink" x="96" y="98" text-anchor="middle">6 · Physical</text>
    <text class="tiny mute" x="16" y="126">Body you can rely on</text>
    <text class="s mute" x="16" y="150">Walk. Lift. Stretch.</text>
    <text class="s mute" x="16" y="170">Consistency &gt; program.</text>
    <text class="tiny moss" x="16" y="198">Proof: I keep promises.</text>
  </g>

  <g transform="translate(252,846)">
    <rect width="192" height="220" rx="16" fill="light-dark(#e8f0f8, #1c2430)"></rect>
    <rect width="192" height="220" rx="16" fill="none" stroke="light-dark(#b0c6dc, #3a4e66)" stroke-width="2"></rect>
    <circle cx="96" cy="48" r="28" fill="light-dark(#1f3a5f, #7aa2d4)"></circle>
    <rect x="82" y="36" width="28" height="24" rx="3" fill="light-dark(#fffaf2, #1a1814)"></rect>
    <line x1="88" y1="42" x2="104" y2="42" stroke="light-dark(#1f3a5f, #7aa2d4)" stroke-width="2"></line>
    <line x1="88" y1="48" x2="100" y2="48" stroke="light-dark(#1f3a5f, #7aa2d4)" stroke-width="2"></line>
    <text class="b ink" x="96" y="98" text-anchor="middle">7 · Mental</text>
    <text class="tiny mute" x="16" y="126">Raise input quality</text>
    <text class="s mute" x="16" y="150">Books &gt; scroll feed</text>
    <text class="s mute" x="16" y="170">Journal to digest ideas</text>
    <text class="tiny navy" x="16" y="198">30 focused minutes/day</text>
  </g>

  <g transform="translate(456,846)">
    <rect width="192" height="220" rx="16" fill="light-dark(#fff1e4, #2a2218)"></rect>
    <rect width="192" height="220" rx="16" fill="none" stroke="light-dark(#e0c0a0, #5a4030)" stroke-width="2"></rect>
    <circle cx="96" cy="48" r="28" fill="light-dark(#c45c26, #e89a5c)"></circle>
    <path d="M84 56 h24 v-16 h-8 l-4-8 h-8 z" fill="light-dark(#fffaf2, #1a1814)"></path>
    <text class="b ink" x="96" y="98" text-anchor="middle">8 · Financial</text>
    <text class="tiny mute" x="16" y="126">Own what compounds</text>
    <text class="s mute" x="16" y="150">Skill · product · platform</text>
    <text class="s mute" x="16" y="170">Not just a bigger paycheck</text>
    <text class="tiny accent" x="16" y="198">2 deep hours on assets</text>
  </g>

  <g transform="translate(660,846)">
    <rect width="192" height="220" rx="16" fill="light-dark(#f3eaf5, #261e2a)"></rect>
    <rect width="192" height="220" rx="16" fill="none" stroke="light-dark(#d2b8d8, #4a3650)" stroke-width="2"></rect>
    <circle cx="96" cy="48" r="28" fill="light-dark(#6b3a6e, #c9a0d4)"></circle>
    <circle cx="96" cy="48" r="10" fill="none" stroke="light-dark(#fffaf2, #1a1814)" stroke-width="3"></circle>
    <text class="b ink" x="96" y="98" text-anchor="middle">9 · Spiritual</text>
    <text class="tiny mute" x="16" y="126">Sit with yourself</text>
    <text class="s mute" x="16" y="150">No phone. No input.</text>
    <text class="s mute" x="16" y="170">Clarity comes from quiet</text>
    <text class="tiny" x="16" y="198" fill="light-dark(#6b3a6e, #c9a0d4)">Control mind → rest sticks</text>
  </g>

  <rect x="48" y="1090" width="804" height="210" rx="18" fill="light-dark(#eaf7f5, #1a2826)"></rect>
  <rect x="48" y="1090" width="804" height="210" rx="18" fill="none" stroke="light-dark(#a8d4cc, #355550)" stroke-width="2"></rect>
  <text class="tiny teal" x="72" y="1122">MONTHS 10–12</text>
  <text class="h ink" x="72" y="1150">10 · Identity shift</text>
  <text class="s mute" x="72" y="1178">You stop “trying” to be disciplined. You just are. Resistance fades; defaults take over.</text>
  <text class="s mute" x="72" y="1202">The outer world slowly mirrors the inner change—skills, assets, opportunities, maybe money.</text>
  <text class="b teal" x="72" y="1236">Month 12 isn’t the win. It’s when reality starts matching who you became months earlier.</text>
  <text class="s mute" x="72" y="1268">Double down on what works. Raise the standard of what you accept from yourself.</text>

  <g transform="translate(48,1328)">
    <rect width="804" height="120" rx="16" fill="url(#hatch)"></rect>
    <rect width="804" height="120" rx="16" fill="light-dark(#1f1a14, #f3ebe0)" opacity="0.92"></rect>
    <text class="h" x="402" y="48" text-anchor="middle" fill="light-dark(#fffaf2, #1a1814)">Ignore the early scoreboard</text>
    <text class="s" x="402" y="78" text-anchor="middle" fill="light-dark(#d8cfc2, #4a4034)">Audit habits today · Control what you can · Let lagging results arrive on their own clock</text>
  </g>

  <g transform="translate(48,1472)">
    <text class="tiny mute" x="0" y="16">12-MONTH ARC</text>
    <rect x="0" y="36" width="240" height="14" rx="7" fill="light-dark(#c45c26, #e89a5c)"></rect>
    <rect x="250" y="36" width="340" height="14" rx="7" fill="light-dark(#0f6e6a, #4db8b0)"></rect>
    <rect x="600" y="36" width="204" height="14" rx="7" fill="light-dark(#1f3a5f, #7aa2d4)"></rect>
    <text class="tiny ink" x="0" y="72">1–3 Stop bleed</text>
    <text class="tiny ink" x="250" y="72">4–9 Core Four</text>
    <text class="tiny ink" x="600" y="72">10–12 Identity</text>
    <text class="s mute" x="0" y="108">Habits today → person in 6 months → visible life in 12 months</text>
  </g>

  <circle cx="820" cy="220" r="8" fill="light-dark(#c45c26, #e89a5c)"></circle>
